name: Build and Release

# Tag-driven release. Pushing a tag matching the version in package.json is the
# ONLY step needed to start a release - electron-builder creates the GitHub
# Release and uploads every installer itself via the "publish" block in
# electron-builder.json5.
#
# NOTE: the created release is a DRAFT (electron-builder's GitHub publisher
# defaults to draft). It is NOT published automatically. Once all three platform
# jobs are green, open the draft and click "Publish release".
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Two runs on the same tag must not race for the GitHub Release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      # One OS failing should not cancel the other platforms.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [24]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Release preflight
        # Fails fast on partially configured signing secrets, which would
        # otherwise blow up deep inside electron-builder after a long build.
        run: node scripts/release-preflight.js
        env:
          VITE_DISCOGS_CONSUMER_KEY: ${{ secrets.VITE_DISCOGS_CONSUMER_KEY }}
          VITE_DISCOGS_CONSUMER_SECRET: ${{ secrets.VITE_DISCOGS_CONSUMER_SECRET }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Export signing credentials
        # IMPORTANT: never inject these directly into a step's `env:`.
        # `${{ secrets.X }}` resolves to an EMPTY STRING when the secret is
        # absent, and electron-builder treats an empty CSC_LINK as "a
        # certificate was specified". Its macOS path (macCodeSign.js) then calls
        # importCertificate("") with no empty-guard and crashes with
        # "<project dir> not a file", failing the whole macOS job.
        # Writing to GITHUB_ENV only when non-empty keeps "absent" truly absent.
        shell: bash
        run: |
          export_optional() {
            if [ -n "$2" ]; then
              echo "$1=$2" >> "$GITHUB_ENV"
              echo "  $1: set"
            fi
          }
          echo "Signing credentials found:"
          export_optional CSC_LINK                    "${{ secrets.CSC_LINK }}"
          export_optional CSC_KEY_PASSWORD            "${{ secrets.CSC_KEY_PASSWORD }}"
          export_optional APPLE_API_KEY               "${{ secrets.APPLE_API_KEY }}"
          export_optional APPLE_API_KEY_ID            "${{ secrets.APPLE_API_KEY_ID }}"
          export_optional APPLE_API_ISSUER            "${{ secrets.APPLE_API_ISSUER }}"
          export_optional APPLE_ID                    "${{ secrets.APPLE_ID }}"
          export_optional APPLE_APP_SPECIFIC_PASSWORD "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
          export_optional APPLE_TEAM_ID               "${{ secrets.APPLE_TEAM_ID }}"

      - name: Install dependencies
        run: npm ci

      - name: Build, package and publish
        run: npm run build
        env:
          # Lets electron-builder create the Release and upload the assets.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_DISCOGS_CONSUMER_KEY: ${{ secrets.VITE_DISCOGS_CONSUMER_KEY }}
          VITE_DISCOGS_CONSUMER_SECRET: ${{ secrets.VITE_DISCOGS_CONSUMER_SECRET }}
          # CSC_* / APPLE_* arrive from the "Export signing credentials" step
          # above, and are absent entirely when no certificate is configured.

      - name: Upload build artifacts
        # The real installers are already attached to the GitHub Release.
        # This is a convenience copy so a build stays downloadable even when
        # publishing failed, and it deliberately skips the huge unpacked dirs.
        uses: actions/upload-artifact@v7
        with:
          name: cuesto-${{ runner.os }}
          # "!"-prefixed lines are exclusion patterns for upload-artifact.
          path: |
            release/
            !release/**/*-unpacked/
          retention-days: 30
          if-no-files-found: warn